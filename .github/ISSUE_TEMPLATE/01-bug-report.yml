name: Bug report
description: Report a reproducible Khabeer problem
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: 'This is the Khabeer tracker. Redact secrets and personal data. Report vulnerabilities privately through the Security tab.'
  - type: textarea
    id: reproduction
    attributes:
      label: What happened and how to reproduce it
      description: Include expected behavior and the steps that produce the problem.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Android/device, app version or commit, and provider/model if relevant.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or screenshots
      description: Do not include API keys, authentication tokens or private conversations.
